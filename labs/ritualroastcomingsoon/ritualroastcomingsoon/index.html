
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background: #101820;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            width: 100%;
            min-height: 120px;
            padding: 20px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 180px;
            max-width: 25%;
            height: auto;
            object-fit: contain;
        }

        .banner {
            width: 65%;
            max-width: 750px;
            height: auto;
            object-fit: contain;
        }

        /* Main section */
        .coming-soon {
            flex: 1;
            width: 100%;
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 5%;
            position: relative;
            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(255, 255, 255, 0.06),
                    transparent 65%
                );
        }

        .coming-soon img {
            display: block;
            width: 100%;
            max-width: 1100px;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            animation: fadeIn 1.2s ease forwards;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.3));
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 18px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .header {
                min-height: 90px;
                padding: 15px 5%;
                gap: 20px;
            }

            .logo {
                width: 120px;
            }

            .banner {
                width: 65%;
            }

            .coming-soon {
                padding: 35px 4%;
                min-height: 60vh;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            .logo {
                width: 120px;
                max-width: 80%;
                margin: 0;
            }

            .banner {
                width: 100%;
                max-width: 100%;
            }

            .coming-soon {
                min-height: 55vh;
                padding: 25px 15px;
            }

            .coming-soon img {
                border-radius: 6px;
            }

            footer {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <img src="logo.png" alt="Logo" class="logo">
        <img src="main-banner.jpg" alt="Main Banner" class="banner">
    </header>

    <main class="coming-soon">
        <img src="coming-soon.jpg" alt="Coming Soon">
    </main>

    <footer>
        &copy; 2026. All Rights Reserved.
    </footer>

</body>
</html>
